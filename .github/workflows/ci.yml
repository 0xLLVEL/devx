name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build and test (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Typecheck frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/desktop
        run: npm run test

      # `tauri::generate_context!` embeds the frontend bundle, so the web assets
      # must exist before anything Rust-side is compiled.
      - name: Build frontend
        working-directory: apps/desktop
        run: npx vite build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Build debug binary
        run: cargo build --workspace

      # Pushes to main additionally produce a release-mode NSIS installer,
      # uploaded as a workflow artifact (no GitHub Release is created here;
      # that only happens when a v* tag is pushed, see release.yml).
      - name: Build release installer
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/make-installer.ps1

      - name: Upload installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: DevX-${{ github.sha }}-x64-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

[package]
name = "devx-proc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Process supervision for DevX: job objects, health checks, log capture"

[dependencies]
devx-core = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
# For `#[specta(type = specta_typescript::Number)]` on log sequence numbers.
specta-typescript = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
devx-provision = { workspace = true }
pretty_assertions = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
